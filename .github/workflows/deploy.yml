jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g firebase-tools
      - run: firebase deploy --only hosting --project kamasutra-videos --token "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
